services:
  migrate:
    container_name: magnet-feed-sync-migrate
    image: git.pkarpovich.space/pkarpovich/magnet-feed-sync-migrate:latest
    restart: "no"
    volumes:
      - .db:/.db

  magnet-feed-sync:
    container_name: magnet-feed-sync
    image: git.pkarpovich.space/pkarpovich/magnet-feed-sync:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      QBITTORRENT_URL: ${QBITTORRENT_URL}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      QBITTORRENT_DESTINATION: ${QBITTORRENT_DESTINATION}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_SUPER_USERS: ${TELEGRAM_SUPER_USERS}
      JACKETT_URL: ${JACKETT_URL:-}
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      JACKETT_PUBLIC_URL: ${JACKETT_PUBLIC_URL:-}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-}
      NATS_URL: ${NATS_URL:-}
      WATCH_CRON: ${WATCH_CRON:-}
      DOWNLOAD_CRON: ${DOWNLOAD_CRON:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-magnet-feed-sync}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      BASE_STATIC_PATH: /static
      HTTP_PORT: 8080
    volumes:
      - .db:/.db
    expose:
      - 8080
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.magnet-feed-sync.rule=Host(`magnet-feed-sync.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.magnet-feed-sync.entrypoints=https"
      - "traefik.http.routers.magnet-feed-sync.tls.certresolver=le"

networks:
  proxy:
    external: true
